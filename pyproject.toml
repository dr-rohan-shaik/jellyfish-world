[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfish-world"
version = "1.0.0"
description = "Jellyfish World - Terminal-first companion app with MCP bridge for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
byok = []
local_llm = []
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest-cov>=4.1.0",
]

[project.entry-points.console_scripts]
jellyfish = "src.companion.session:main"
jelly = "src.cli.jelly:main"
hey = "src.cli.hey:main"

[project.urls]
Homepage = "https://github.com/dr-rohan-shaik/jellyfish-world"
Repository = "https://github.com/dr-rohan-shaik/jellyfish-world"
Issues = "https://github.com/dr-rohan-shaik/jellyfish-world/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "T20"
]
ignore = [
    "E501", "B008", "T201"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
files = ["src"]

[[tool.mypy.overrides]]
module = "src.autostart.cmd_autorun"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.autostart.powershell"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.bridge.auto_connect"
ignore_missing_imports = true